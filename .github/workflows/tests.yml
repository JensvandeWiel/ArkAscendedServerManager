name: Tests

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  python:
    name: Data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scraper tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Option audit
        run: python tools/audit-options.py --check

  kotlin:
    name: Core and UI
    runs-on: windows-latest
    env:
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew.bat :core:test --console=plain
      - name: UI compile
        run: ./gradlew.bat :ui:compileKotlin --console=plain
